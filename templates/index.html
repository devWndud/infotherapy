{% extends 'base.html' %}
{% block title %}Infotherapy · 홈{% endblock %}
{% block content %}
  <section class="hero">
    <div>
      <span class="eyebrow">Infotherapy</span>
      <h1>INFOTHERAPY</h1>
      <p>천안월봉고 대표 AI SW동아리</p>
      
    </div>
  </section>

  <section class="section centered">
    <div class="grid">
      <a class="card" href="{{ url_for('learn') }}" style="text-decoration:none; color:inherit;">
        <h3>학습</h3>
        <p>동아리 부원 전용 프로그래밍 학습 공간입니다</p>
      </a>
      <div class="card">
        <h3>동아리 소개</h3>
        <p>우리는 실전 중심 학습과 협업을 지향합니다</p>
      </div>
    </div>
  </section>

  <section class="section centered">
    <h2 style="margin:0 0 16px;">기장단</h2>
    <div class="team">
      <div class="team-item">
        <div class="avatar"></div>
        <div class="team-name">김희성</div>
        <div class="team-role">부기장</div>
      </div>
      <div class="team-item">
        <div class="avatar"></div>
        <div class="team-name">신주영</div>
        <div class="team-role">기장</div>
      </div>
      <div class="team-item">
        <div class="avatar"></div>
        <div class="team-name">빈자리</div>
        <div class="team-role">공석</div>
      </div>
    </div>
  </section>

  <section class="section centered">
    <h2 style="margin:0 0 16px;">2025 INFO</h2>
    <div class="timeline">
      <div class="timeline-item">
        <div class="timeline-node"></div>
        <div class="timeline-content">
          <div class="timeline-title">-</div>
          <div class="timeline-desc">-</div>
        </div>
      </div>
    </div>
  </section>
{% endblock %}
