{% extends 'base.html' %}
{% block title %}로그인 · Infotherapy{% endblock %}
{% block content %}
  <h2 style="margin-bottom: 16px;">로그인</h2>
  <form class="form" method="post">
    <div class="row">
      <label for="name">이름</label>
      <input id="name" name="name" type="text" placeholder="홍길동" required>
    </div>
    <div class="row">
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" placeholder="비밀번호" required minlength="6">
    </div>
    <button class="btn btn-primary" type="submit">로그인</button>
    <div class="hint">계정이 없나요? <a href="{{ url_for('signup') }}">회원가입</a></div>
  </form>
{% endblock %}
