{% extends 'base.html' %}
{% block title %}로그인 · Infotherapy{% endblock %}
{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <img src="{{ static_url('images/icon.png') }}" alt="Infotherapy">
        <h1>Infotherapy</h1>
      </div>
      <h2>로그인</h2>
      <p>동아리 부원 전용 로그인</p>
    </div>
    
    <form class="auth-form" method="post">
      <div class="form-group">
        <label for="name">이름</label>
        <input id="name" name="name" type="text" placeholder="홍길동" required>
      </div>
      
      <div class="form-group">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" placeholder="비밀번호를 입력하세요" required minlength="6">
      </div>
      
      <button class="auth-btn" type="submit">
        <span>로그인</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
      
      <div class="auth-footer">
        <p>계정이 없나요? <a href="{{ url_for('signup') }}">회원가입</a></p>
      </div>
    </form>
  </div>
</div>

<style>
.auth-container {
  height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 0;
  margin: 0;
  padding-top: 15vh;
  background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(248,250,255,0.95)), url('{{ url_for('static', filename='images/info.jpg') }}');
  background-size: cover;
  background-position: center 100%;
  background-repeat: no-repeat;
  background-attachment: scroll;
  overflow: hidden;
}

.auth-card {
  background: white;
  border-radius: 20px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
  padding: 2rem 2rem;
  width: 100%;
  max-width: 380px;
  position: relative;
  overflow: hidden;
}

.auth-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, #3b82f6, #1d4ed8);
}

.auth-header {
  text-align: center;
  margin-bottom: 1.5rem;
}

.auth-logo {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
  margin-bottom: 1rem;
}

.auth-logo img {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  object-fit: cover;
}

.auth-logo h1 {
  font-size: 1.5rem;
  font-weight: 700;
  color: #2d3748;
  margin: 0;
}

.auth-header h2 {
  font-size: 1.75rem;
  font-weight: 600;
  color: #2d3748;
  margin: 0 0 0.5rem 0;
}

.auth-header p {
  color: #718096;
  font-size: 0.9rem;
  margin: 0;
}

.auth-form {
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.form-group label {
  font-weight: 500;
  color: #4a5568;
  font-size: 0.9rem;
}

.form-group input {
  padding: 0.875rem 1rem;
  border: 2px solid #e2e8f0;
  border-radius: 12px;
  font-size: 1rem;
  transition: all 0.2s ease;
  background: #f7fafc;
}

.form-group input:focus {
  outline: none;
  border-color: #3b82f6;
  background: white;
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}

.form-group input::placeholder {
  color: #a0aec0;
}

.auth-btn {
  background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
  color: white;
  border: none;
  padding: 1rem 1.5rem;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  margin-top: 0.5rem;
}

.auth-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
}

.auth-btn:active {
  transform: translateY(0);
}

.auth-footer {
  text-align: center;
  margin-top: 1.5rem;
  padding-top: 1.5rem;
  border-top: 1px solid #e2e8f0;
}

.auth-footer p {
  color: #718096;
  font-size: 0.9rem;
  margin: 0;
}

.auth-footer a {
  color: #3b82f6;
  text-decoration: none;
  font-weight: 500;
  transition: color 0.2s ease;
}

.auth-footer a:hover {
  color: #1d4ed8;
}

@media (max-width: 768px) {
  .auth-container {
    padding-top: 10vh;
    background-position: center 80%;
  }
  
  .auth-card {
    padding: 1.5rem;
    margin: 0 1rem;
    max-width: calc(100% - 2rem);
    border-radius: 16px;
  }
  
  .auth-logo img {
    width: 36px;
    height: 36px;
  }
  
  .auth-logo h1 {
    font-size: 1.25rem;
  }
  
  .auth-header h2 {
    font-size: 1.5rem;
  }
  
  .form-group input {
    padding: 1rem;
    font-size: 16px;
  }
  
  .auth-btn {
    padding: 1rem;
    font-size: 1rem;
  }
}

@media (max-width: 640px) {
  .auth-container {
    padding-top: 8vh;
    background-position: center 70%;
  }
  
  .auth-card {
    padding: 1.25rem;
    margin: 0 0.75rem;
    max-width: calc(100% - 1.5rem);
  }
  
  .auth-logo {
    gap: 0.5rem;
    margin-bottom: 0.75rem;
  }
  
  .auth-logo img {
    width: 32px;
    height: 32px;
  }
  
  .auth-logo h1 {
    font-size: 1.125rem;
  }
  
  .auth-header h2 {
    font-size: 1.375rem;
  }
  
  .auth-header p {
    font-size: 0.85rem;
  }
  
  .auth-form {
    gap: 1rem;
  }
  
  .form-group input {
    padding: 0.875rem;
  }
  
  .auth-btn {
    padding: 0.875rem;
  }
}

@media (max-width: 480px) {
  .auth-container {
    padding-top: 6vh;
    background-position: center 60%;
  }
  
  .auth-card {
    padding: 1rem;
    margin: 0 0.5rem;
    max-width: calc(100% - 1rem);
    border-radius: 12px;
  }
  
  .auth-logo img {
    width: 28px;
    height: 28px;
  }
  
  .auth-logo h1 {
    font-size: 1rem;
  }
  
  .auth-header h2 {
    font-size: 1.25rem;
  }
  
  .auth-header p {
    font-size: 0.8rem;
  }
  
  .form-group label {
    font-size: 0.85rem;
  }
  
  .form-group input {
    padding: 0.75rem;
    font-size: 16px;
    border-radius: 10px;
  }
  
  .auth-btn {
    padding: 0.75rem;
    font-size: 0.9rem;
    border-radius: 10px;
  }
  
  .auth-footer p {
    font-size: 0.8rem;
  }
}

@media (hover: none) and (pointer: coarse) {
  .auth-btn:hover {
    transform: none;
    box-shadow: 0 5px 15px rgba(59, 130, 246, 0.2);
  }
  
  .auth-btn:active {
    transform: scale(0.98);
  }
  
  .form-group input:focus {
    box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
  }
}
</style>
{% endblock %}
